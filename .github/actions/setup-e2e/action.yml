name: Setup e2e environment
description: Install the toolchain, build all packages and install Playwright browsers for the e2e suite

inputs:
  browsers:
    description: Space-separated Playwright browsers to install
    required: false
    default: chromium
  cache-key-prefix:
    description: Prefix for the Playwright browser cache key
    required: false
    default: playwright

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Use Node.js lts/*
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: lts/*
        cache: "pnpm"

    - run: pnpm install
      shell: bash

    - name: Build packages
      run: pnpm run build
      shell: bash

    - name: Get Playwright version
      id: playwright-version
      working-directory: e2e
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      working-directory: e2e
      run: npx playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
