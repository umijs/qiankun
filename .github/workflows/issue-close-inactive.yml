name: Issue Close Inactive

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  issues: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close inactive labeled issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const rules = [
              {
                label: 'Need Reproduction',
                days: 30,
                body: 'Since the issue was labeled with `Need Reproduction`, but no response in 30 days. This issue will be close. If you have any questions, you can comment and reply.\n由于该 issue 被标记为需要可复现步骤，却 30 天未收到回应。现关闭 issue，若有任何问题，可评论回复。',
              },
              {
                label: 'pls use issue template',
                days: 30,
                body: 'Since the issue was labeled with `pls use issue template`, but no response in 30 days. This issue will be close. If you have any questions, you can comment and reply.\n由于该 issue 被标记为需要使用模板，却 30 天未收到回应。现关闭 issue，若有任何问题，可评论回复。',
              },
              {
                label: 'out-of-scope',
                days: 30,
                body: 'Since the issue was labeled with `out-of-scope`, but no response in 30 days. This issue will be close. If you have any questions, you can comment and reply.\n由于该 issue 被标记为与本项目无关，却 30 天未收到回应。现关闭 issue，若有任何问题，可评论回复。',
              },
              {
                label: 'inactive',
                days: 7,
                body: 'Since the issue was labeled with `inactive`, but no response in 7 days. This issue will be close. If you have any questions, you can comment and reply.\n由于该 issue 被标记为不活跃，且 7 天未收到回应。现关闭 issue，若有任何问题，可评论回复。',
              },
            ];

            const { owner, repo } = context.repo;
            for (const { label, days, body } of rules) {
              const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: label,
                per_page: 100,
              });

              for (const issue of issues) {
                if (issue.pull_request || new Date(issue.updated_at).getTime() >= cutoff) continue;
                // Never close an issue that doesn't actually carry the label.
                if (!issue.labels.some((l) => (typeof l === 'string' ? l : l.name) === label)) continue;

                core.info(`Closing #${issue.number} (${label})`);
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
              }
            }
