name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - next
    paths:
      - "docs/**"
      - ".github/workflows/cloudflare-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

# Scope concurrency per ref so a PR preview and the production (next) deploy
# never cancel each other; a newer push to the same ref supersedes the old one.
concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs cannot read the Cloudflare secrets, so skip the preview for them
    # (they would only fail). Same-repo branch PRs and pushes still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      # PRs deploy to a stable per-PR preview branch (pr-<number>); pushes and
      # manual runs deploy under their own ref name (next => production).
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - run: pnpm install

      - name: Build docs
        run: pnpm run docs:build # outputs to docs/.vitepress/dist

      # Use npx directly instead of cloudflare/wrangler-action: the action
      # auto-installs wrangler via `pnpm add`, which fails at a pnpm workspace
      # root (ERR_PNPM_ADDING_TO_ROOT). npx installs to its own cache instead.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(npx -y wrangler@4 pages deploy docs/.vitepress/dist \
            --project-name=qiankun --branch="$DEPLOY_BRANCH" 2>&1) || code=$?
          echo "$output"
          if [ "${code:-0}" -ne 0 ]; then exit "$code"; fi
          # Parse the real URLs from wrangler's output — the project's public
          # subdomain (e.g. qiankun-d6r.pages.dev) is not derivable from the name.
          # "alias URL"     -> stable per-branch link (pr-<n>.<project>.pages.dev)
          # "peek over at"  -> unique per-deploy link (<hash>.<project>.pages.dev)
          alias_url=$(printf '%s\n' "$output" | sed -n 's#.*[Aa]lias URL: *\(https://[A-Za-z0-9.-]*\.pages\.dev\).*#\1#p' | tail -n1)
          deploy_url=$(printf '%s\n' "$output" | sed -n 's#.*peek over at \(https://[A-Za-z0-9.-]*\.pages\.dev\).*#\1#p' | tail -n1)
          # Fall back to any *.pages.dev URL if the wording changes.
          any_url=$(printf '%s\n' "$output" | grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -n1 || true)
          [ -z "$deploy_url" ] && deploy_url="$any_url"
          [ -z "$alias_url" ] && alias_url="$deploy_url"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const alias = process.env.ALIAS_URL;
            const deploy = process.env.DEPLOY_URL || alias;
            const sha = context.sha.substring(0, 7);
            const body = [
              marker,
              '### 📖 Docs preview is ready',
              '',
              '| | |',
              '| --- | --- |',
              `| **Preview (this PR)** | ${alias} |`,
              `| **This build** | ${deploy} |`,
              `| **Commit** | \`${sha}\` |`,
              '',
              '<sub>Deployed to Cloudflare Pages. Updates on every push to this PR.</sub>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
