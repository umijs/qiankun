name: Changesets

on:
  push:
    branches:
      - next

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  changelog:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: changeset-release
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the changeset/release-notes generators derive
          # the release range from `git describe`/`git log` (see scripts/commit-utils.mjs).
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm run build

      # Replaces the manual "write a .changeset/*.md per PR" step: derive the
      # pending changesets from the complete unreleased commit range, so the
      # changesets action below can rebuild its release PR from the base branch.
      # Idempotent (files named auto-<sha>); over-wide ranges never duplicate.
      - name: Generate changesets from commits
        run: node scripts/generate-changesets.mjs

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          version: pnpm ci:version
          publish: pnpm ci:publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PROVENANCE: true

      # `changeset publish` sends a package to `latest` instead of the prerelease
      # tag whenever EVERY version already on npm carries that same prerelease
      # identifier: it reads that as "no regular release yet" and falls back
      # (getReleaseTag in @changesets/cli). Packages that only ever shipped as
      # -rc.N — the UI bindings, @qiankunjs/single-spa — therefore freeze their
      # `rc` tag at the first publish while `latest` tracks the newest build, so
      # the `@rc` install commands in the docs resolve to a stale version. Point
      # the tag back at what was just published; a no-op for the packages
      # changesets already tagged correctly.
      - name: Re-point the prerelease dist-tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          PRE_MODE=$(jq -r '.mode // "exit"' .changeset/pre.json 2>/dev/null || echo exit)
          if [ "${PRE_MODE}" != "pre" ]; then
            echo "Not in prerelease mode (${PRE_MODE}) — publish already owns the tag."
            exit 0
          fi

          PRE_TAG=$(jq -r '.tag' .changeset/pre.json)
          echo '${{ steps.changesets.outputs.publishedPackages }}' \
            | jq -r '.[] | "\(.name)@\(.version)"' \
            | while read -r spec; do
                echo "Tagging ${spec} as ${PRE_TAG}"
                npm dist-tag add "${spec}" "${PRE_TAG}"
              done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Create Unified GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(jq -r '.version' packages/qiankun/package.json)
          TAG="v${VERSION}"

          # Aggregate every published package's CHANGELOG entry into one set of
          # notes → a single GitHub Release. It can then be polished after the
          # fact via the /release-changelog skill (gh release edit).
          node scripts/generate-release-notes.mjs '${{ steps.changesets.outputs.publishedPackages }}' > /tmp/release-notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
