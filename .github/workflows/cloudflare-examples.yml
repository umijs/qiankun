name: Deploy Examples to Cloudflare Pages

on:
  push:
    branches:
      - next
    paths:
      # the examples consume the workspace packages via `workspace:*`, so a package change is an
      # examples change — that is the whole point of deploying them
      - "packages/**"
      - "examples/**"
      - "scripts/build-examples-site.mjs"
      - ".github/workflows/cloudflare-examples.yml"
  # PRs into next that change the examples get a preview deployment: `wrangler pages deploy`
  # with a non-production branch name is all it takes, Pages hosts it under a branch alias and
  # production stays untouched. Deliberately narrower than the push paths — packages/** PRs
  # would preview on every core change, and what a preview is for is reviewing the examples
  # themselves; after merge the production deploy covers the packages case anyway.
  pull_request:
    branches:
      - next
    paths:
      - "examples/**"
      - "scripts/build-examples-site.mjs"
      - ".github/workflows/cloudflare-examples.yml"
  workflow_dispatch:

# Avoid overlapping deploys stepping on each other — per ref, so a PR's preview and the
# production deploy never cancel each other. `head_ref` is only set on pull_request runs.
concurrency:
  group: cloudflare-examples-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # fork PRs cannot read the Cloudflare secrets below — skip cleanly instead of failing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the sticky preview-URL comment below
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - run: pnpm install

      - name: Build packages
        run: pnpm run build:packages

      - name: Build examples site
        run: node scripts/build-examples-site.mjs # outputs to dist-examples

      # Use npx directly instead of cloudflare/wrangler-action: the action
      # auto-installs wrangler via `pnpm add`, which fails at a pnpm workspace
      # root (ERR_PNPM_ADDING_TO_ROOT). npx installs to its own cache instead.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `shell: bash` for pipefail: without it the tee would swallow a failed deploy.
        # On pull_request runs `ref_name` is the useless "<n>/merge", hence `head_ref` first.
        shell: bash
        run: npx -y wrangler@4 pages deploy dist-examples --project-name=qiankun-examples --branch=${{ github.head_ref || github.ref_name }} | tee deploy.log

      # The alias URL wrangler prints is the stable per-branch one — surface it where a
      # reviewer looks: the run summary and, first of all, the PR conversation. One sticky
      # comment per PR, edited in place on every push instead of piling up.
      - name: Surface the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Preview deployment"
            grep -Eo 'https://[^ ]+\.pages\.dev' deploy.log | sort -u | sed 's/^/- /' || true
          } > preview.md
          cat preview.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body-file preview.md --edit-last --create-if-none
