name: Deploy Examples to Cloudflare Pages

on:
  push:
    branches:
      - next
    paths:
      # the examples consume the workspace packages via `workspace:*`, so a package change is an
      # examples change — that is the whole point of deploying them
      - "packages/**"
      - "examples/**"
      - "scripts/build-examples-site.mjs"
      - ".github/workflows/cloudflare-examples.yml"
  workflow_dispatch:

# Avoid overlapping deploys stepping on each other
concurrency:
  group: cloudflare-examples
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - run: pnpm install

      - name: Build packages
        run: pnpm run build:packages

      - name: Build examples site
        run: node scripts/build-examples-site.mjs # outputs to dist-examples

      # Use npx directly instead of cloudflare/wrangler-action: the action
      # auto-installs wrangler via `pnpm add`, which fails at a pnpm workspace
      # root (ERR_PNPM_ADDING_TO_ROOT). npx installs to its own cache instead.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages deploy dist-examples --project-name=qiankun-examples --branch=${{ github.ref_name }}
