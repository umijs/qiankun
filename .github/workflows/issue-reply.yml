name: Issue Reply

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  reply-helper:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["pr welcome", "help wanted", "pls use issue template", "Need Reproduction"]'), github.event.label.name)
    steps:
      - name: Reply to labeled issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { label, issue } = context.payload;
            const user = `@${issue.user.login}`;
            const { owner, repo } = context.repo;
            let body;
            let close = false;

            switch (label.name) {
              case 'pr welcome':
              case 'help wanted':
                body = [
                  `Hello ${user}. We totally like your proposal/feedback, welcome to send us a Pull Request for it. Please be sure to fill in the default template in the Pull Request, provide changelog/documentation/test cases if needed and make sure CI passed, we will review it soon. We appreciate your effort in advance and looking forward to your contribution!`,
                  '',
                  `你好 ${user}，我们完全同意你的提议/反馈，欢迎直接在此仓库创建一个 Pull Request 来解决这个问题。请务必填写 Pull Request 内的预设模板，提供改动所需相应的 changelog、测试用例、文档等，并确保 CI 通过，我们会尽快进行 Review，提前感谢和期待您的贡献。`,
                ].join('\n');
                break;
              case 'pls use issue template':
                body = [
                  `Hello ${user}. To save both time, please use the issue template to report. This issue will be closed.`,
                  '',
                  `你好 ${user}，为节约大家的时间，请使用 issue 模板反馈问题。该 issue 将要被关闭。`,
                ].join('\n');
                close = true;
                break;
              case 'Need Reproduction':
                body = [
                  `Hello ${user}. Please provide a minimal reproduction in [CodeSandbox](https://codesandbox.io/) or a GitHub repository, and include your exact qiankun version. For qiankun 3.x, you can refer to the [live examples](https://examples.qiankunjs.com) and use the [example source code](https://github.com/umijs/qiankun/tree/next/examples) as a starting point.`,
                  '',
                  `你好 ${user}，请提供 [CodeSandbox](https://codesandbox.io/) 或 GitHub 仓库中的最小复现示例，并注明 qiankun 完整版本号。使用 qiankun 3.x 时，可以参考[在线示例](https://examples.qiankunjs.com)，也可以在[示例源码](https://github.com/umijs/qiankun/tree/next/examples)的基础上构建复现。`,
                  '',
                  '![](https://gw.alipayobjects.com/zos/antfincdn/y9kwg7DVCd/reproduce.gif)',
                ].join('\n');
                break;
              default:
                return;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            if (close) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
