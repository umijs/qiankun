<!doctype html>
<!--
  The deployed site's 404 page (copied to the site root by scripts/build-examples-site.mjs).

  It is load-bearing, not decoration: its presence is what tells Cloudflare Pages this is not a
  single-page app, so unmatched paths answer with a real 404 instead of the root shell at status
  200. The Vue shell's "Missing app" route depends on that — its entry has to actually fail.

  Standalone by design: no build step, no shared stylesheet, so it works wherever it lands.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found · qiankun examples</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236051A5'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23F6F7F9' font-family='serif'%3E%E4%B9%BE%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f7f8fa;
        --surface: #ffffff;
        --ink: #1b1f26;
        --ink-soft: #5c6470;
        --hairline: #e4e7ec;
        --primary: #6051a5;
        --amber: #e5a540;
        --font-sans: 'IBM Plex Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        --font-display: 'Space Grotesk', 'IBM Plex Sans', sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
      }

      main {
        max-width: 520px;
        padding: 40px 32px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--surface);
        box-shadow:
          0 1px 2px rgb(28 32 38 / 4%),
          0 8px 24px rgb(28 32 38 / 6%);
      }

      .seal {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 7px;
        background:
          linear-gradient(135deg, transparent 62%, var(--amber) 62%),
          var(--primary);
        color: #f6f7f9;
        font-family: 'Songti SC', 'STSong', serif;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -1px;
      }

      .eyebrow {
        margin: 24px 0 10px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--primary);
      }

      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      p {
        margin: 14px 0 0;
        font-size: 15px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      nav {
        display: flex;
        gap: 20px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--hairline);
        font-family: var(--font-mono);
        font-size: 12px;
      }

      a {
        color: var(--ink-soft);
        text-decoration: none;
        transition: color 150ms ease-out;
      }

      a:hover {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="seal" aria-hidden="true">乾坤</span>
      <p class="eyebrow">404</p>
      <h1>Nothing is served at this path.</h1>
      <p>
        These are the qiankun examples: two host shells mounting the same four micro apps, each with the JS sandbox and
        runtime style isolation on. Pick a shell below.
      </p>
      <nav>
        <a href="/">React host</a>
        <a href="/vue-host/">Vue host</a>
        <a href="/standalone-sandbox/">Standalone sandbox</a>
        <a href="https://github.com/umijs/qiankun">umijs/qiankun ↗</a>
      </nav>
    </main>
  </body>
</html>
